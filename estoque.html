<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estoque e alertas — Controle de Doações</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/validacao.js"></script>
  <script src="js/app.js"></script>
  <script src="js/paginas/exigir-sessao.js"></script>
</head>
<body>
  <header class="topbar">
    <a href="index.html" aria-label="Voltar ao menu">← Menu</a>
    <h1>📦 Estoque e alertas</h1>
    <a href="movimentacao.html">+ Movimentação</a>
  </header>

  <main class="container">
    <div id="alertas" class="alertas" aria-live="polite"></div>

    <div class="resumo" aria-label="Resumo do estoque">
      <div><strong id="total-ok">0</strong>Lotes OK</div>
      <div class="r-alerta"><strong id="total-alerta">0</strong>Vencem em até 30 dias</div>
      <div class="r-vencido"><strong id="total-vencido">0</strong>Vencidos</div>
    </div>

    <section class="card" aria-labelledby="titulo-estoque">
      <div class="filtros">
        <h2 id="titulo-estoque" class="titulo-filtro">Itens em estoque</h2>
        <div class="campo">
          <label for="busca">Buscar por nome</label>
          <input id="busca" type="search" placeholder="Ex.: arroz">
        </div>
      </div>
      <div class="tabela-wrapper">
        <table>
          <thead>
            <tr><th>Alimento</th><th>Lote</th><th>Quantidade</th><th>Validade</th><th>Status</th></tr>
          </thead>
          <tbody id="corpo-estoque"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/paginas/estoque.js"></script>
</body>
</html>
