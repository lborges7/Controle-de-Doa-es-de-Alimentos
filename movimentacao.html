<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrar movimentação — Controle de Doações</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/validacao.js"></script>
  <script src="js/app.js"></script>
  <script>exigirSessao();</script>
</head>
<body>
  <header class="topbar">
    <a href="index.html" aria-label="Voltar ao menu">← Menu</a>
    <h1>📋 Registrar movimentação</h1>
    <a href="estoque.html">Estoque →</a>
  </header>

  <main class="container">
    <section class="card" aria-labelledby="titulo-form">
      <h2 id="titulo-form">Nova entrada ou saída</h2>
      <div id="msg" class="mensagem" role="alert" aria-live="polite"></div>
      <form id="form-mov" novalidate>
        <div class="grid">
          <div class="campo">
            <label for="tipo">Tipo <span class="obrigatorio" aria-hidden="true">*</span></label>
            <select id="tipo" name="tipo" required>
              <option value="">Selecione...</option>
              <option value="entrada">Entrada (doação)</option>
              <option value="saida">Saída (distribuição)</option>
            </select>
          </div>
          <div class="campo">
            <label for="nome">Nome do alimento <span class="obrigatorio" aria-hidden="true">*</span></label>
            <input id="nome" name="nome" type="text" list="lista-alimentos" placeholder="Ex.: Arroz 5kg" required>
            <datalist id="lista-alimentos"></datalist>
          </div>
          <div class="campo">
            <label for="lote">Lote <span class="obrigatorio" aria-hidden="true">*</span></label>
            <input id="lote" name="lote" type="text" placeholder="Ex.: L2026-01" required>
          </div>
          <div class="campo">
            <label for="quantidade">Quantidade <span class="obrigatorio" aria-hidden="true">*</span></label>
            <input id="quantidade" name="quantidade" type="number" min="1" step="1" required>
          </div>
          <div class="campo">
            <label for="validade">Validade <span class="obrigatorio" aria-hidden="true">*</span></label>
            <input id="validade" name="validade" type="date" required>
          </div>
          <div class="campo">
            <label for="responsavel">Responsável <span class="obrigatorio" aria-hidden="true">*</span></label>
            <input id="responsavel" name="responsavel" type="text" placeholder="Nome de quem registrou" required>
          </div>
        </div>
        <button class="btn" type="submit">Salvar movimentação</button>
      </form>
    </section>

    <section class="card" aria-labelledby="titulo-lista">
      <div class="filtros">
        <h2 id="titulo-lista" style="flex:2; margin:0">Últimas 10 movimentações</h2>
        <div class="campo">
          <label for="filtro-tipo">Filtrar por tipo</label>
          <select id="filtro-tipo">
            <option value="">Todos</option>
            <option value="entrada">Entradas</option>
            <option value="saida">Saídas</option>
          </select>
        </div>
      </div>
      <div class="tabela-wrapper">
        <table>
          <thead>
            <tr><th>Data</th><th>Tipo</th><th>Alimento</th><th>Lote</th><th>Qtd.</th><th>Validade</th><th>Responsável</th></tr>
          </thead>
          <tbody id="corpo-lista"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const form = document.getElementById('form-mov');
      const msg = document.getElementById('msg');
      const filtro = document.getElementById('filtro-tipo');
      const CAMPOS = ['tipo', 'nome', 'lote', 'quantidade', 'validade', 'responsavel'];
      const ROTULOS = { tipo: 'Tipo', nome: 'Nome do alimento', lote: 'Lote', quantidade: 'Quantidade', validade: 'Validade', responsavel: 'Responsável' };

      function mostrar(texto, tipo) { msg.className = 'mensagem ' + tipo; msg.textContent = texto; }

      function renderLista() {
        let lista = obterMovimentacoes().slice().reverse();
        if (filtro.value) lista = lista.filter(function (m) { return m.tipo === filtro.value; });
        lista = lista.slice(0, 10);
        const corpo = document.getElementById('corpo-lista');
        if (!lista.length) { corpo.innerHTML = '<tr><td colspan="7" class="vazio">Nenhuma movimentação registrada.</td></tr>'; return; }
        corpo.innerHTML = lista.map(function (m) {
          return '<tr><td>' + new Date(m.dataRegistro).toLocaleString('pt-BR') + '</td>' +
            '<td><span class="tag ' + m.tipo + '">' + (m.tipo === 'entrada' ? 'Entrada' : 'Saída') + '</span></td>' +
            '<td>' + escaparHtml(m.nome) + '</td><td>' + escaparHtml(m.lote) + '</td><td>' + m.quantidade + '</td>' +
            '<td>' + formatarData(m.validade) + '</td><td>' + escaparHtml(m.responsavel) + '</td></tr>';
        }).join('');
        // Sugestões de alimentos já cadastrados
        const nomes = Array.from(new Set(obterMovimentacoes().map(function (m) { return m.nome; })));
        document.getElementById('lista-alimentos').innerHTML = nomes.map(function (n) { return '<option value="' + escaparHtml(n) + '">'; }).join('');
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        const dados = {};
        CAMPOS.forEach(function (c) { dados[c] = form[c].value.trim(); form[c].classList.remove('invalido'); });

        const req = validarCamposObrigatorios(dados, CAMPOS);
        if (!req.valido) {
          req.faltando.forEach(function (c) { form[c].classList.add('invalido'); });
          form[req.faltando[0]].focus();
          return mostrar('Preencha os campos obrigatórios: ' + req.faltando.map(function (c) { return ROTULOS[c]; }).join(', ') + '.', 'erro');
        }
        if (!validarQuantidade(dados.quantidade)) {
          form.quantidade.classList.add('invalido');
          return mostrar('A quantidade deve ser um número inteiro maior que zero.', 'erro');
        }
        if (dados.tipo === 'entrada' && !validarValidade(dados.validade)) {
          form.validade.classList.add('invalido');
          return mostrar('Para entradas, a validade deve ser uma data futura.', 'erro');
        }
        if (dados.tipo === 'saida') {
          const saldo = saldoDisponivel(obterMovimentacoes(), dados.nome, dados.lote);
          if (Number(dados.quantidade) > saldo) {
            form.quantidade.classList.add('invalido');
            return mostrar('Saldo insuficiente para este alimento/lote. Disponível: ' + saldo + '.', 'erro');
          }
        }

        salvarMovimentacao(dados);
        mostrar('Movimentação registrada com sucesso!', 'sucesso');
        const responsavel = dados.responsavel;
        form.reset();
        form.responsavel.value = responsavel;
        renderLista();
      });

      filtro.addEventListener('change', renderLista);
      renderLista();
    })();
  </script>
</body>
</html>
